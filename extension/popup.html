<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>scoop.md</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="bar">
    <div class="brand">
      <img src="icons/icon48.png" alt="" width="26" height="26">
      <span>scoop<span class="ext">.md</span></span>
    </div>
    <div class="tools">
      <label class="switch" title="Share public docs with the scoop.md library">
        <input type="checkbox" id="share-toggle" aria-label="Share with the library">
        <span class="track"><span class="knob"></span></span>
      </label>
      <a id="settings" href="#" class="icon" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94a7.07 7.07 0 0 0 .06-.94 7.07 7.07 0 0 0-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7.03 7.03 0 0 0-1.63-.94l-.36-2.54A.5.5 0 0 0 13.9 2h-3.84a.5.5 0 0 0-.49.42l-.36 2.54c-.59.24-1.13.56-1.63.94l-2.39-.96a.5.5 0 0 0-.61.22L2.66 8.48a.5.5 0 0 0 .12.64l2.03 1.58a7.07 7.07 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.39.3.61.22l2.39-.96c.5.38 1.04.7 1.63.94l.36 2.54c.05.24.25.42.49.42h3.84c.24 0 .44-.18.49-.42l.36-2.54c.59-.24 1.13-.56 1.63-.94l2.39.96c.22.08.48 0 .61-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58ZM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Z"/></svg>
      </a>
      <button id="theme" class="icon" type="button" title="Switch light or dark" aria-label="Switch light or dark">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.3 22A10 10 0 0 1 9.1 2.5a.75.75 0 0 1 .9 1A8 8 0 0 0 20.5 14a.75.75 0 0 1 1 .9A10 10 0 0 1 12.3 22Z"/><path d="M17 3l.6 1.4L19 5l-1.4.6L17 7l-.6-1.4L15 5l1.4-.6L17 3Zm3.5 4.5.4.9.9.4-.9.4-.4.9-.4-.9-.9-.4.9-.4.4-.9Z"/></svg>
      </button>
    </div>
  </header>

  <main>
    <div id="intro" class="intro" hidden>
      <span>Public docs you scoop are shared so others get a version that worked.</span>
      <button id="intro-ok" class="x" type="button" aria-label="Dismiss">×</button>
    </div>

    <div class="head">
      <p id="status" class="busy" role="status">Scooping this page…</p>
      <p id="summary" class="meta" hidden></p>
    </div>

    <textarea id="preview" readonly spellcheck="false" aria-label="Text to paste into your agent" placeholder="The docs for this page will appear here."></textarea>

    <button id="copy" class="copy" type="button" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1Zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2Zm0 16H8V7h11v14Z"/></svg>
      <span id="copy-label">Copy for your agent</span>
    </button>

    <section class="agents" aria-label="Works with">
      <p class="meta">Paste into</p>
      <ul>
        <li><span class="logo" style="--logo:url(agents/claude.svg)"></span>Claude Code</li>
        <li><span class="logo" style="--logo:url(agents/openai.svg)"></span>Codex</li>
        <li><span class="logo" style="--logo:url(agents/cursor.svg)"></span>Cursor</li>
        <li><span class="logo" style="--logo:url(agents/githubcopilot.svg)"></span>Copilot</li>
        <li><span class="logo" style="--logo:url(agents/windsurf.svg)"></span>Windsurf</li>
        <li><span class="logo" style="--logo:url(agents/googlegemini.svg)"></span>Gemini CLI</li>
      </ul>
    </section>

    <footer class="foot">
      <p id="share" class="meta" hidden></p>
      <div id="feedback" hidden>
        <span class="meta">Did it work?</span>
        <button data-worked="true" class="vote" type="button" title="It worked" aria-label="It worked"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg></button>
        <button data-worked="false" class="vote" type="button" title="It didn't work" aria-label="It didn't work"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3H6c-.83 0-1.54.5-1.84 1.22l-3.02 7.05c-.09.23-.14.47-.14.73v2c0 1.1.9 2 2 2h6.31l-.95 4.57-.03.32c0 .41.17.79.44 1.06L9.83 23l6.59-6.59c.36-.36.58-.86.58-1.41V5c0-1.1-.9-2-2-2zm4 0v12h4V3h-4z"/></svg></button>
        <a id="report-open" href="#" class="quiet">Report</a>
      </div>
      <p id="voted" class="meta" hidden></p>
      <form id="report" hidden>
        <select id="reason" aria-label="Reason">
          <option value="wrong">Wrong or outdated</option>
          <option value="malicious">Malicious instructions</option>
          <option value="copyright">Copyright</option>
          <option value="other">Other</option>
        </select>
        <button type="submit" class="small">Send</button>
      </form>
      <button id="rebuild" class="quiet link" type="button" hidden>Rebuild from this page</button>
    </footer>
  </main>

  <script type="module" src="popup.js"></script>
</body>
</html>
