<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>scoop.md settings</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <header class="bar">
    <div class="brand">
      <img src="icons/icon48.png" alt="" width="24" height="24">
      <span>scoop<span class="ext">.md</span></span>
    </div>
  </header>

  <main>
    <section id="pin-hint" class="card pin-hint" hidden>
      <div class="row">
        <span class="text"><svg class="pin" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg><span>Pin scoop.md to the toolbar to see which sites have an llms.txt <span class="meta">(puzzle-piece menu › pin)</span>.</span></span>
        <button id="pin-ok" class="button" type="button">OK</button>
      </div>
    </section>

    <section class="card">
      <label class="row" for="telemetry">
        <span class="text">
          <span class="title">Send usage statistics</span>
          <span class="meta">Anonymous events: which sites you open scoop.md on, whether their llms.txt was copied, versions, browser, OS and errors. Never page content or anything signed-in.</span>
          <span class="meta">Install ID <span id="install-id" class="mono"></span>, for <a href="https://scoop.md/privacy#usage-statistics" target="_blank" rel="noopener">deletion requests</a>.</span>
        </span>
        <input id="telemetry" type="checkbox" class="toggle" role="switch">
      </label>
    </section>

    <section class="card">
      <div class="row">
        <span class="title" id="theme-label">Theme</span>
        <div class="segmented" role="radiogroup" aria-labelledby="theme-label">
          <label><input type="radio" name="theme" value="system"><span>System</span></label>
          <label><input type="radio" name="theme" value="light"><span>Light</span></label>
          <label><input type="radio" name="theme" value="dark"><span>Dark</span></label>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="row">
        <span class="text">
          <span class="title">Keyboard shortcut</span>
          <span id="shortcut" class="meta">…</span>
        </span>
        <button id="shortcuts" class="button" type="button">Change</button>
      </div>
    </section>
  </main>

  <footer class="foot">
    <a href="https://scoop.md/privacy" target="_blank" rel="noopener">Privacy</a>
    <a href="https://scoop.md/terms" target="_blank" rel="noopener">Terms</a>
    <span id="version"></span>
  </footer>
  <script type="module" src="options.js"></script>
</body>
</html>
